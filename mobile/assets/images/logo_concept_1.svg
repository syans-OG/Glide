<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    
    <!-- Monogram G Gradients -->
    <linearGradient id="gWing1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    
    <linearGradient id="gWing2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    
    <linearGradient id="laserGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284C7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad1)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Kinetic Monogram G (Aerodynamic Glider Chevron) -->
  <g filter="url(#softGlow)" transform="translate(0, -6)">
    <!-- Top Arc & Upper Wing of 'G' -->
    <path d="M370 180 C340 125 285 96 216 96 C124 96 64 168 64 260 C64 352 126 424 224 424 C310 424 368 368 380 292 C382 280 372 270 360 270 L240 270 C228 270 218 280 218 292 C218 304 228 314 240 314 L324 314 C310 354 272 380 224 380 C154 380 110 328 110 260 C110 192 152 140 216 140 C264 140 300 162 324 200 L370 180 Z" fill="url(#gWing1)"/>

    <!-- Glider Paper Arrow Overlap / Core Jet -->
    <path d="M216 140 L388 236 C398 242 398 256 388 262 L216 358 C202 366 186 354 186 338 L216 260 L186 160 C186 144 202 132 216 140 Z" fill="url(#gWing2)" opacity="0.95"/>

    <!-- Laser Focal Beam Dot -->
    <circle cx="396" cy="249" r="16" fill="url(#laserGlow)"/>
    <circle cx="396" cy="249" r="28" fill="#34D399" opacity="0.25"/>
  </g>
</svg>
