<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Wave Ribbon Gradients -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="wave2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <filter id="neonBeam" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Squircle Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad3)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#1E293B" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Background Shadow Wave Track -->
  <path d="M100 340 C170 340 210 280 270 240 C330 200 370 170 420 170" fill="none" stroke="url(#wave2)" stroke-width="48" stroke-linecap="round" opacity="0.4"/>

  <!-- Main Dynamic Gliding Haptic Wave -->
  <path d="M90 310 C160 310 200 240 270 190 C330 150 360 130 400 130" fill="none" stroke="url(#wave1)" stroke-width="36" stroke-linecap="round"/>

  <!-- Lower Echo Wave (Slide Transition Ripple) -->
  <path d="M140 380 C200 380 240 330 300 290 C350 260 380 250 410 250" fill="none" stroke="url(#wave1)" stroke-width="20" stroke-linecap="round" opacity="0.65"/>

  <!-- Laser Pointer Focal Orb -->
  <g filter="url(#neonBeam)">
    <circle cx="400" cy="130" r="18" fill="#34D399"/>
    <circle cx="400" cy="130" r="32" fill="#34D399" opacity="0.3"/>
  </g>
</svg>
