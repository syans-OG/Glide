<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Character Shading -->
    <linearGradient id="planeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <linearGradient id="planeWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <filter id="softGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad2)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#475569" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Character IP: Aero Glider emerging from lower-left -->
  <g filter="url(#softGlow2)" transform="rotate(-8 256 256)">
    <!-- Cyan Inner Wing Fold -->
    <path d="M160 380 L380 300 C405 290 415 260 395 240 L280 130 C265 115 240 120 230 140 L140 330 C130 355 140 375 160 380 Z" fill="url(#planeWing)"/>

    <!-- Main White Chubby Glider Body -->
    <path d="M110 390 C95 405 120 430 145 425 L340 370 C365 362 380 340 370 315 L245 105 C235 85 205 85 195 105 L95 340 C85 365 95 378 110 390 Z" fill="url(#planeBody)"/>

    <!-- Cute Eyes and Smile on Nose -->
    <circle cx="150" cy="360" r="13" fill="#0F172A"/>
    <circle cx="210" cy="345" r="13" fill="#0F172A"/>
    <!-- Eye highlights -->
    <circle cx="147" cy="356" r="4" fill="#FFFFFF"/>
    <circle cx="207" cy="341" r="4" fill="#FFFFFF"/>
    <!-- Cheerful curved mouth -->
    <path d="M172 368 Q180 376 188 365" stroke="#0F172A" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Soft blush dots -->
    <circle cx="134" cy="374" r="8" fill="#F43F5E" opacity="0.35"/>
    <circle cx="224" cy="358" r="8" fill="#F43F5E" opacity="0.35"/>
  </g>
</svg>
