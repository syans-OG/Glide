<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg2b" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="70%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Jet Body Shading -->
    <linearGradient id="bodyGrad2b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Wing Gradient -->
    <linearGradient id="wingGrad2b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="softGlow2b" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="512" height="512" rx="116" fill="url(#bg2b)"/>
  <rect width="508" height="508" x="2" y="2" rx="114" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Character IP: Aero Glider floating dynamically -->
  <g filter="url(#softGlow2b)" transform="translate(256, 256) rotate(-8) translate(-256, -256)">
    <!-- Right Cyan Wing -->
    <path d="M260 170 C350 170 420 230 420 280 C420 310 390 325 360 310 L260 270 Z" fill="url(#wingGrad2b)"/>

    <!-- Left Cyan Wing -->
    <path d="M240 170 C150 170 80 230 80 280 C80 310 110 325 140 310 L240 270 Z" fill="url(#wingGrad2b)"/>

    <!-- Main Chubby Porcelain Jet Body -->
    <path d="M250 85 C275 85 320 170 330 270 C336 340 310 400 285 415 C270 425 230 425 215 415 C190 400 164 340 170 270 C180 170 225 85 250 85 Z" fill="url(#bodyGrad2b)"/>

    <!-- Cute Big Round Eyes -->
    <ellipse cx="218" cy="220" rx="13" ry="16" fill="#0F172A"/>
    <ellipse cx="282" cy="220" rx="13" ry="16" fill="#0F172A"/>
    <!-- Catchlights -->
    <circle cx="214" cy="214" r="5" fill="#FFFFFF"/>
    <circle cx="278" cy="214" r="5" fill="#FFFFFF"/>
    <circle cx="222" cy="226" r="2.5" fill="#FFFFFF"/>
    <circle cx="286" cy="226" r="2.5" fill="#FFFFFF"/>

    <!-- Joyful Smile -->
    <path d="M242 242 Q250 252 258 242" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" fill="none"/>

    <!-- Cute Rosy Blush -->
    <ellipse cx="196" cy="236" rx="9" ry="6" fill="#F43F5E" opacity="0.35"/>
    <ellipse cx="304" cy="236" rx="9" ry="6" fill="#F43F5E" opacity="0.35"/>

    <!-- Laser Pointer Dome at Nose -->
    <circle cx="250" cy="85" r="9" fill="#10B981"/>
    <circle cx="250" cy="85" r="18" fill="#34D399" opacity="0.35"/>
  </g>
</svg>
