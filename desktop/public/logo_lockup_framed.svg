<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 140" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon Frame -->
    <radialGradient id="bgIconFramed" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Facet Gradients -->
    <linearGradient id="facetTopFramed" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="facetLeftFramed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="cyanWingFramed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="laserBeamFramed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <filter id="framedShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Left: Proportional Squircle Icon (100x100, Y=20..120, Center Y=70) -->
  <g transform="translate(20, 20)">
    <rect width="100" height="100" rx="24" fill="url(#bgIconFramed)"/>
    <rect width="98" height="98" x="1" y="1" rx="23" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Scaled Aero Origami Symbol -->
    <g filter="url(#framedShadow)" transform="translate(50, 51) scale(0.20) rotate(-14) translate(-256, -256)">
      <path d="M256 96 L410 330 C424 352 408 380 382 376 L256 320 Z" fill="url(#cyanWingFramed)"/>
      <path d="M256 96 L256 320 L130 376 C104 380 88 352 102 330 Z" fill="url(#facetLeftFramed)"/>
      <path d="M256 96 L330 320 C336 338 322 354 304 350 L256 338 L208 350 C190 354 176 338 182 320 Z" fill="url(#facetTopFramed)"/>
      <circle cx="256" cy="94" r="14" fill="url(#laserBeamFramed)"/>
      <circle cx="256" cy="94" r="28" fill="#34D399" opacity="0.4"/>
    </g>
  </g>

  <!-- Right: Perfectly Centered Typography Block (Center Y=70) -->
  <g transform="translate(144, 0)">
    <!-- Brand Name "Glide" -->
    <text x="0" y="72" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="50" font-weight="800" fill="#FFFFFF" letter-spacing="-0.03em">
      Glide
    </text>
    <!-- Subtitle -->
    <text x="2" y="96" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="0.14em">
      OFFLINE REMOTE
    </text>
  </g>
</svg>
