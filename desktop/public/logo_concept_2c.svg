<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg2c" cx="70%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Body Shading -->
    <linearGradient id="body2c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Wing Layer 1 (Bright Cyan) -->
    <linearGradient id="wingTop2c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Wing Layer 2 (Deep Electric Blue) -->
    <linearGradient id="wingBack2c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <filter id="shadow2c" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0284C7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="512" height="512" rx="116" fill="url(#bg2c)"/>
  <rect width="508" height="508" x="2" y="2" rx="114" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Aero Glider Emerging from Lower-Left, banking upwards -->
  <g filter="url(#shadow2c)">
    <!-- Back Underwing Layer -->
    <path d="M120 440 L430 290 C455 278 460 245 435 228 L300 135 C282 122 256 128 245 148 L100 395 C90 415 102 438 120 440 Z" fill="url(#wingBack2c)"/>

    <!-- Front Cyan Wing -->
    <path d="M130 430 L395 300 C418 290 422 262 402 248 L290 170 C276 160 256 164 246 180 L120 390 C110 408 118 426 130 430 Z" fill="url(#wingTop2c)"/>

    <!-- Main White Glider Body -->
    <path d="M85 460 C70 475 95 498 120 490 L345 425 C372 418 390 392 380 365 L265 118 C254 95 220 95 208 118 L80 395 C70 418 75 445 85 460 Z" fill="url(#body2c)"/>

    <!-- Cute Eyes -->
    <ellipse cx="145" cy="405" rx="12" ry="14" fill="#0F172A"/>
    <ellipse cx="205" cy="388" rx="12" ry="14" fill="#0F172A"/>
    <!-- Catchlights -->
    <circle cx="142" cy="400" r="4" fill="#FFFFFF"/>
    <circle cx="202" cy="383" r="4" fill="#FFFFFF"/>
    <circle cx="149" cy="410" r="2" fill="#FFFFFF"/>
    <circle cx="209" cy="393" r="2" fill="#FFFFFF"/>

    <!-- Playful Wink/Smile -->
    <path d="M168 412 Q176 420 184 410" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" fill="none"/>

    <!-- Soft Rosy Cheeks -->
    <circle cx="126" cy="418" r="8" fill="#F43F5E" opacity="0.35"/>
    <circle cx="222" cy="400" r="8" fill="#F43F5E" opacity="0.35"/>

    <!-- Glowing Laser Pointer Beacon at Nose Tip -->
    <circle cx="236" cy="106" r="9" fill="#10B981"/>
    <circle cx="236" cy="106" r="20" fill="#34D399" opacity="0.4"/>
  </g>
</svg>
