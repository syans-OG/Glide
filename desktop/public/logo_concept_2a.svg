<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark OLED Background with subtle radial ambient glow -->
    <radialGradient id="bgOfficial" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Top Paper Wing Facet (Porcelain Pearl) -->
    <linearGradient id="facetTop" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Bottom Left Wing Facet (Soft Shadow Pearl) -->
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Vibrant Electric Cyan Inner Wing -->
    <linearGradient id="cyanWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Emerald Laser Pointer Accent -->
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Precision Drop Shadow -->
    <filter id="proShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0284C7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="512" height="512" rx="116" fill="url(#bgOfficial)"/>
  <rect width="508" height="508" x="2" y="2" rx="114" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.45"/>

  <!-- Pure Minimalist Origami Aero Glider -->
  <g filter="url(#proShadow)" transform="translate(256, 260) rotate(-14) translate(-256, -256)">
    <!-- Right Folded Wing (Vibrant Cyan Underlayer) -->
    <path d="M256 96 L410 330 C424 352 408 380 382 376 L256 320 Z" fill="url(#cyanWing)"/>

    <!-- Left Wing Facet (Soft Shaded Pearl) -->
    <path d="M256 96 L256 320 L130 376 C104 380 88 352 102 330 Z" fill="url(#facetLeft)"/>

    <!-- Top Body Spine Facet (Bright Porcelain) -->
    <path d="M256 96 L330 320 C336 338 322 354 304 350 L256 338 L208 350 C190 354 176 338 182 320 Z" fill="url(#facetTop)"/>

    <!-- Laser Pointer Beacon at Nose Cone -->
    <circle cx="256" cy="94" r="10" fill="url(#laserBeam)"/>
    <circle cx="256" cy="94" r="22" fill="#34D399" opacity="0.35"/>
  </g>
</svg>
